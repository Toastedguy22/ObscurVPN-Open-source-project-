# Run on a Linux VPS you control. Review README before exposing this service.
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: obscurvpn-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
      - SERVERURL=${SERVERURL}
      - SERVERPORT=${SERVERPORT:-51820}
      - PEERS=${PEERS:-1}
      - PEERDNS=${PEERDNS:-1.1.1.1}
      - INTERNAL_SUBNET=${INTERNAL_SUBNET:-10.13.13.0}
      - ALLOWEDIPS=${ALLOWEDIPS:-0.0.0.0/0}
    volumes:
      - ./wireguard-config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "${SERVERPORT:-51820}:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
